name: Verify engines and deploy to GitHub Pages

# Publishes frontend/ as a static export. The astronomy engine now runs in the
# browser (frontend/src/lib/falak/), so Pages hosts the entire product and there
# is no backend in the request path - see DEPLOY.md.
#
# The Python engine in backend/ remains the validated oracle: it is what was
# cross-checked against JPL DE440. The `verify` job below is what keeps the two
# implementations from drifting, and it gates every deploy.

on:
  push:
    branches: [main]
    paths:
      # backend/** matters even though it is no longer deployed: a change to the
      # oracle must re-prove that the browser port still agrees with it.
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; the newer commit always wins.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the browser engine matches the Python oracle
    runs-on: ubuntu-latest

    # The engine itself needs no database, but the suite also covers the DRF
    # views, and five of those tests exercise the IsbatRecord model. They are
    # worth keeping green even though the API is no longer deployed - it is
    # still the reference implementation the browser port is judged against.
    # Defaults match config/settings.py's POSTGRES_* fallbacks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: falak
          POSTGRES_USER: falak
          POSTGRES_PASSWORD: falak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U falak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # The oracle has to be sound before it is worth comparing anything to it.
      # This includes the Skyfield/DE440 cross-check of the conjunction solver
      # (PRD Sec. 5 / CLAUDE.md Phase 0.7).
      - name: Run the Python engine suite
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: pytest -q

      # Regenerating and diffing proves the committed fixture is what the current
      # Python engine actually produces. Without this, someone could change the
      # oracle and leave the browser port pinned to stale numbers - the
      # golden-vector suite would still pass, and both would be wrong.
      - name: Check golden vectors are up to date
        run: |
          python3 backend/scripts/generate_golden_vectors.py
          if ! git diff --exit-code -- frontend/src/lib/falak/__fixtures__/golden-vectors.json; then
            echo "::error::golden-vectors.json is stale. The Python engine changed but the" \
                 "fixture was not regenerated. Run:" \
                 "cd backend && python3 scripts/generate_golden_vectors.py" \
                 "then commit the result."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The conformance suite: replays every golden vector through the TypeScript
      # port and fails on any deviation beyond tolerance.
      - name: Verify the browser engine against the golden vectors
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  build:
    name: Build static export
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          # Pages serves project sites from https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /falak-visualizer
          # NEXT_PUBLIC_API_BASE_URL is deliberately unset. Every calculation runs
          # in the browser, so there is no API to point at; setting it would only
          # surface a dead "API Docs" link in the nav.
        run: npm run build

      # Belt-and-braces: Actions-based Pages deploys skip Jekyll entirely, but
      # this guarantees the _next/ directory is never treated as private.
      - name: Disable Jekyll processing
        run: touch frontend/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pull requests verify and build but must not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
