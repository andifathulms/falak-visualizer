services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falak
      POSTGRES_USER: falak
      POSTGRES_PASSWORD: falak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DJANGO_SECRET_KEY: "dev-only-insecure-secret-key"
      POSTGRES_DB: falak
      POSTGRES_USER: falak
      POSTGRES_PASSWORD: falak
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "dev-only-insecure-secret-key"
      POSTGRES_DB: falak
      POSTGRES_USER: falak
      POSTGRES_PASSWORD: falak
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - web

volumes:
  postgres_data:
